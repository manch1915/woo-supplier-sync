name: supplier-sync

x-wp-env: &wp-env
  WORDPRESS_DB_HOST: db
  WORDPRESS_DB_NAME: wordpress
  WORDPRESS_DB_USER: wordpress
  WORDPRESS_DB_PASSWORD: ${DB_PASSWORD:-wordpress}
  WORDPRESS_CONFIG_EXTRA: |
    define( 'WP_ENVIRONMENT_TYPE', getenv( 'WP_ENVIRONMENT_TYPE' ) ?: 'local' );
    define( 'DISABLE_WP_CRON', true );
    define( 'WP_HOME', getenv( 'SITE_URL' ) ?: 'http://localhost:8080' );
    define( 'WP_SITEURL', getenv( 'SITE_URL' ) ?: 'http://localhost:8080' );
    define( 'AUTOMATIC_UPDATER_DISABLED', true );
    define( 'DISALLOW_FILE_EDIT', true );
  SITE_URL: ${SITE_URL:-http://localhost:8080}
  WP_ENVIRONMENT_TYPE: ${WP_ENVIRONMENT_TYPE:-local}
  DEMO_LOGIN_HINT: ${DEMO_LOGIN_HINT:-demo / demo}

x-wp-volumes: &wp-volumes
  - wordpress:/var/www/html
  - ./plugin:/var/www/html/wp-content/plugins/woo-supplier-sync
  - ./docker/mu-plugins:/var/www/html/wp-content/mu-plugins:ro
  - ./demo:/demo:ro

services:
  db:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: ${DB_PASSWORD:-wordpress}
      MARIADB_RANDOM_ROOT_PASSWORD: "1"
    volumes:
      - db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30

  # Builds the admin app and storefront scripts into plugin/assets/build.
  assets:
    image: node:22-alpine
    working_dir: /plugin
    command: sh -c "npm ci --no-audit --no-fund && npm run build"
    volumes:
      - ./plugin:/plugin
      - node_modules:/plugin/node_modules

  wordpress:
    image: wordpress:php8.3-apache
    restart: unless-stopped
    ports:
      - "${WP_PORT:-8080}:80"
    environment: *wp-env
    volumes: *wp-volumes
    depends_on:
      db:
        condition: service_healthy

  # One-shot: installs WordPress, WooCommerce and the demo store, then exits.
  setup:
    image: wordpress:cli-php8.3
    user: "33:33"
    environment:
      <<: *wp-env
      DEMO_ADMIN_PASSWORD: ${DEMO_ADMIN_PASSWORD:-}
      DEMO_USER_PASSWORD: ${DEMO_USER_PASSWORD:-demo}
    volumes: *wp-volumes
    entrypoint: ["sh", "/demo/setup.sh"]
    depends_on:
      wordpress:
        condition: service_started
      assets:
        condition: service_completed_successfully
      feeds:
        condition: service_started

  # Runs Action Scheduler and WP-Cron. On a real server this is a system cron entry.
  worker:
    image: wordpress:cli-php8.3
    user: "33:33"
    restart: unless-stopped
    environment: *wp-env
    volumes: *wp-volumes
    entrypoint: ["sh", "/demo/worker.sh"]
    depends_on:
      setup:
        condition: service_completed_successfully

  # Three made-up suppliers: a YML feed, a CSV price list and a small shop to scrape.
  feeds:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${FEEDS_PORT:-8081}:80"
    volumes:
      - ./demo/feeds:/usr/share/nginx/html:ro
      - ./demo/nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  db:
  wordpress:
  node_modules:
