server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    charset utf-8;

    location / {
        index index.html;
        try_files $uri $uri/ $uri.html =404;
    }

    location ~* \.(xml|yml)$ {
        types { }
        default_type application/xml;
    }

    location ~* \.csv$ {
        types { }
        default_type text/csv;
    }
}
